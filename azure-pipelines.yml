trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: terraformAction
    displayName: Terraform Action
    type: string
    default: apply
    values:
      - apply
      - destroy

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  terraformWorkingDirectory: 'terraform'
  azureServiceConnection: 'azure-sre-assessment'

stages:

# ============================================================
# STAGE 1 - VALIDATE
# ============================================================

- stage: Validate
  displayName: Terraform Validate

  jobs:
    - job: ValidateTerraform
      displayName: Validate Terraform

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing remote Terraform backend..."

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Terraform Format
        # ----------------------------------------------------

        - bash: |
            set -e

            cd "$(terraformWorkingDirectory)"

            echo "Checking Terraform formatting..."

            terraform fmt -check -recursive
          displayName: Terraform Format Check

        # ----------------------------------------------------
        # Terraform Validate
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Validate
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              echo "Subscription ID: $TF_VAR_subscription_id"

              terraform validate


# ============================================================
# STAGE 2 - PLAN
# ============================================================

- stage: Plan
  displayName: Terraform Plan

  dependsOn: Validate

  condition: succeeded()

  jobs:
    - job: TerraformPlan
      displayName: Terraform Plan

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Terraform Plan
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Plan
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              echo "Subscription ID: $TF_VAR_subscription_id"

              echo "Terraform action: ${{ parameters.terraformAction }}"

              if [ "${{ parameters.terraformAction }}" = "destroy" ]; then

                echo "=========================================="
                echo "CREATING DESTROY PLAN"
                echo "=========================================="

                terraform plan \
                  -destroy \
                  -input=false \
                  -out=tfplan

              else

                echo "=========================================="
                echo "CREATING APPLY PLAN"
                echo "=========================================="

                terraform plan \
                  -input=false \
                  -out=tfplan

              fi

        # ----------------------------------------------------
        # Publish Plan
        # ----------------------------------------------------

        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan'
            artifact: terraform-plan


# ============================================================
# STAGE 3 - TERRAFORM APPLY / DESTROY
# ============================================================

- stage: TerraformDeploy
  displayName: Terraform ${{ parameters.terraformAction }}

  dependsOn: Plan

  condition: succeeded()

  jobs:
    - job: TerraformApply
      displayName: Terraform ${{ parameters.terraformAction }}

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Download Terraform Plan
        # ----------------------------------------------------

        - task: DownloadPipelineArtifact@2
          displayName: Download Terraform Plan
          inputs:
            artifact: terraform-plan
            path: '$(Pipeline.Workspace)/terraform-plan'

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Terraform Apply / Destroy
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform ${{ parameters.terraformAction }}
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              echo "=========================================="
              echo "Terraform Action"
              echo "=========================================="

              echo "${{ parameters.terraformAction }}"

              echo "Subscription ID:"
              echo "$TF_VAR_subscription_id"

              terraform apply \
                -input=false \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"

        # ----------------------------------------------------
        # Terraform Output
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Output
          condition: succeeded()
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform output


# ============================================================
# STAGE 4 - BUILD + PUSH DOCKER
# ONLY FOR APPLY
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image

  dependsOn: TerraformDeploy

  condition: |
    and(
      succeeded(),
      eq('${{ parameters.terraformAction }}', 'apply')
    )

  jobs:
    - job: Docker
      displayName: Build Docker Image

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Build + Push
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Build and Push Docker Image
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              ACR_NAME=$(terraform output -raw acr_name)

              echo "ACR Name: $ACR_NAME"

              az acr login --name "$ACR_NAME"

              IMAGE_TAG="$(Build.BuildId)"

              IMAGE="$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG"

              cd ..

              echo "Building image:"
              echo "$IMAGE"

              docker build \
                -t "$IMAGE" \
                .

              echo "Pushing image:"

              docker push "$IMAGE"


# ============================================================
# STAGE 5 - DEPLOY CONTAINER APP
# ONLY FOR APPLY
# ============================================================

- stage: ContainerAppDeploy
  displayName: Deploy Container App

  dependsOn: BuildAndPush

  condition: |
    and(
      succeeded(),
      eq('${{ parameters.terraformAction }}', 'apply')
    )

  jobs:
    - job: DeployContainerApp
      displayName: Deploy Container App

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Deploy Container App
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Update Container App
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              ACR_NAME=$(terraform output -raw acr_name)
              RESOURCE_GROUP=$(terraform output -raw resource_group_name)
              CONTAINER_APP=$(terraform output -raw container_app_name)

              IMAGE="$ACR_NAME.azurecr.io/sre-api:$(Build.BuildId)"

              echo "Resource Group: $RESOURCE_GROUP"
              echo "Container App: $CONTAINER_APP"
              echo "Image: $IMAGE"

              az containerapp update \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE"

              echo "Container App deployment completed."

        # ----------------------------------------------------
        # Get Application URL
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Get Application URL
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              RESOURCE_GROUP=$(terraform output -raw resource_group_name)
              CONTAINER_APP=$(terraform output -raw container_app_name)

              FQDN=$(az containerapp show \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn \
                --output tsv)

              echo ""
              echo "=========================================="
              echo "FastAPI Application"
              echo "=========================================="
              echo "https://$FQDN"
              echo ""
              echo "Swagger:"
              echo "https://$FQDN/docs"
              echo "=========================================="


# ============================================================
# STAGE 6 - AUTOMATIC CLEANUP
#
# Runs when:
# Terraform Apply fails
# Docker Build/Push fails
# Container App deployment fails
#
# Uses REMOTE STATE to destroy resources that were successfully
# recorded before the failure.
# ============================================================

- stage: Cleanup
  displayName: Cleanup Failed Deployment

  dependsOn:
    - TerraformDeploy
    - BuildAndPush
    - ContainerAppDeploy

  condition: |
    or(
      failed('TerraformDeploy'),
      failed('BuildAndPush'),
      failed('ContainerAppDeploy')
    )

  jobs:
    - job: CleanupTerraform
      displayName: Terraform Destroy Failed Deployment

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo install terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Initialize Remote Backend
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "=========================================="
              echo "Initializing Remote Terraform Backend"
              echo "=========================================="

              terraform init \
                -input=false \
                -reconfigure

        # ----------------------------------------------------
        # Destroy Resources
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Cleanup Terraform Resources
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              export TF_VAR_subscription_id=$(az account show --query id -o tsv)

              echo "=========================================="
              echo "AUTOMATIC TERRAFORM CLEANUP"
              echo "=========================================="

              echo "Subscription ID:"
              echo "$TF_VAR_subscription_id"

              echo "Reading remote Terraform state..."

              terraform state list || true

              echo "Destroying all Terraform-managed resources..."

              terraform destroy \
                -input=false \
                -auto-approve

              echo "=========================================="
              echo "Cleanup completed"
              echo "=========================================="