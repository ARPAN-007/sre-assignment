trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: terraformAction
    displayName: Terraform Action
    type: string
    default: apply
    values:
      - apply
      - destroy

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  terraformWorkingDirectory: 'terraform'
  azureServiceConnection: 'azure-sre-connection'

stages:

# ============================================================
# STAGE 1 - TERRAFORM VALIDATE
# ============================================================

- stage: Validate
  displayName: Terraform Validate

  jobs:
    - job: ValidateTerraform
      displayName: Validate Terraform

      steps:

        - checkout: self
          displayName: Checkout repository

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing Terraform..."

              terraform init -input=false

        # ----------------------------------------------------
        # Terraform Format Check
        # ----------------------------------------------------

        - bash: |
            set -e

            cd "$(terraformWorkingDirectory)"

            terraform fmt -check -recursive
          displayName: Terraform Format Check

        # ----------------------------------------------------
        # Terraform Validate
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Validate
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform validate


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: Terraform Plan

  dependsOn: Validate

  condition: succeeded()

  jobs:
    - job: TerraformPlan
      displayName: Terraform Plan

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init -input=false

        # ----------------------------------------------------
        # Terraform Plan
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Plan
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Terraform action: ${{ parameters.terraformAction }}"

              if [ "${{ parameters.terraformAction }}" = "destroy" ]; then

                echo "Creating DESTROY plan..."

                terraform plan \
                  -destroy \
                  -input=false \
                  -out=tfplan

              else

                echo "Creating APPLY plan..."

                terraform plan \
                  -input=false \
                  -out=tfplan

              fi

        # ----------------------------------------------------
        # Publish Terraform Plan
        # ----------------------------------------------------

        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan'
            artifact: terraform-plan


# ============================================================
# STAGE 3 - TERRAFORM APPLY / DESTROY
# ============================================================

- stage: Deploy
  displayName: Terraform Deploy

  dependsOn: Plan

  condition: succeeded()

  jobs:
    - deployment: TerraformDeploy
      displayName: Terraform ${{ parameters.terraformAction }}

      environment: sre-terraform

      strategy:
        runOnce:
          deploy:

            steps:

              - checkout: self

              # ------------------------------------------------
              # Download Terraform Plan
              # ------------------------------------------------

              - task: DownloadPipelineArtifact@2
                displayName: Download Terraform Plan
                inputs:
                  artifact: terraform-plan
                  path: '$(Pipeline.Workspace)/terraform-plan'

              # ------------------------------------------------
              # Install Terraform
              # ------------------------------------------------

              - bash: |
                  set -e

                  TERRAFORM_VERSION="$(terraformVersion)"

                  echo "Installing Terraform ${TERRAFORM_VERSION}"

                  curl -fsSL \
                    "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
                    -o terraform.zip

                  rm -rf terraform-bin
                  mkdir terraform-bin

                  unzip -o terraform.zip -d terraform-bin

                  sudo mv terraform-bin/terraform /usr/local/bin/terraform

                  terraform version
                displayName: Install Terraform

              # ------------------------------------------------
              # Terraform Init
              # ------------------------------------------------

              - task: AzureCLI@2
                displayName: Terraform Init
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -e

                    cd "$(terraformWorkingDirectory)"

                    echo "Initializing remote Terraform backend..."

                    terraform init -input=false

              # ------------------------------------------------
              # Terraform Apply / Destroy
              # ------------------------------------------------

              - task: AzureCLI@2
                displayName: Terraform ${{ parameters.terraformAction }}
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |

                    set -e

                    cd "$(terraformWorkingDirectory)"

                    echo "=========================================="
                    echo "Terraform Action:"
                    echo "${{ parameters.terraformAction }}"
                    echo "=========================================="

                    if [ "${{ parameters.terraformAction }}" = "destroy" ]; then

                      echo "Executing Terraform DESTROY..."

                      terraform apply \
                        -input=false \
                        -auto-approve \
                        tfplan

                    else

                      echo "Executing Terraform APPLY..."

                      terraform apply \
                        -input=false \
                        -auto-approve \
                        tfplan

                    fi

              # ------------------------------------------------
              # Terraform Output
              # ------------------------------------------------

              - task: AzureCLI@2
                displayName: Terraform Output
                condition: succeeded()
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -e

                    cd "$(terraformWorkingDirectory)"

                    echo "=========================================="
                    echo "Terraform Outputs"
                    echo "=========================================="

                    terraform output


# ============================================================
# 2. DOCKER BUILD + ACR PUSH
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image
  dependsOn: Terraform
  condition: and(
    succeeded(),
    eq('${{ parameters.terraformAction }}', 'apply'))

  jobs:

  - job: Docker
    displayName: Build Docker Image

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Azure Login
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Login to Azure
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          echo "ACR: $ACR_NAME"

          az acr login --name "$ACR_NAME"

    # --------------------------------------------------------
    # Get ACR Name
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Get ACR Information
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          echo "##vso[task.setvariable variable=ACR_NAME]$ACR_NAME"

          echo "ACR_NAME=$ACR_NAME"

    # --------------------------------------------------------
    # Build Docker Image
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Docker Build
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          IMAGE_TAG=$(Build.BuildId)

          docker build \
            -t "$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG" \
            .

    # --------------------------------------------------------
    # Push Docker Image
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Docker Push
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          IMAGE_TAG=$(Build.BuildId)

          az acr login --name "$ACR_NAME"

          docker push \
            "$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG"


# ============================================================
# 3. DEPLOY CONTAINER APP
# ============================================================

- stage: Deploy
  displayName: Deploy FastAPI
  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

  - job: DeployContainerApp
    displayName: Deploy Container App

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: Deploy Container App
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          RESOURCE_GROUP=$(cd terraform && terraform output -raw resource_group_name)

          CONTAINER_APP=$(cd terraform && terraform output -raw container_app_name)

          IMAGE="$ACR_NAME.azurecr.io/sre-api:$(Build.BuildId)"

          echo "Resource Group: $RESOURCE_GROUP"
          echo "Container App: $CONTAINER_APP"
          echo "Image: $IMAGE"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

          echo "Deployment completed."

    # --------------------------------------------------------
    # Get Application URL
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Get Application URL
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          RESOURCE_GROUP=$(cd terraform && terraform output -raw resource_group_name)

          CONTAINER_APP=$(cd terraform && terraform output -raw container_app_name)

          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo ""
          echo "======================================"
          echo " FastAPI Application"
          echo "======================================"
          echo "https://$FQDN"
          echo ""
          echo "Swagger:"
          echo "https://$FQDN/docs"
          echo "======================================"