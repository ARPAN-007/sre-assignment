trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: terraformAction
    displayName: Terraform Action
    type: string
    default: apply
    values:
      - apply
      - destroy

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  terraformWorkingDirectory: 'terraform'
  azureServiceConnection: 'azure-sre-connection'

stages:

# ============================================================
# STAGE 1 - TERRAFORM VALIDATE
# ============================================================

- stage: TerraformValidate
  displayName: Terraform Validate

  jobs:
    - job: ValidateTerraform
      displayName: Validate Terraform

      steps:

        - checkout: self
          displayName: Checkout repository

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing Terraform backend..."

              terraform init -input=false

        # ----------------------------------------------------
        # Terraform Format
        # ----------------------------------------------------

        - bash: |
            set -e

            cd "$(terraformWorkingDirectory)"

            terraform fmt -check -recursive
          displayName: Terraform Format Check

        # ----------------------------------------------------
        # Terraform Validate
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Validate
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              echo "Azure Subscription: $SUBSCRIPTION_ID"

              cat > pipeline.auto.tfvars <<EOF
              subscription_id = "$SUBSCRIPTION_ID"
              EOF

              terraform validate

# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: Terraform Plan

  dependsOn:
    - TerraformValidate

  condition: succeeded()

  jobs:
    - job: PlanTerraform
      displayName: Terraform Plan

      steps:

        - checkout: self
          displayName: Checkout repository

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing remote backend..."

              terraform init -input=false

        # ----------------------------------------------------
        # Create Pipeline Variables
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Prepare Terraform Variables
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              echo "Azure Subscription: $SUBSCRIPTION_ID"

              cat > pipeline.auto.tfvars <<EOF
              subscription_id = "$SUBSCRIPTION_ID"
              EOF

        # ----------------------------------------------------
        # Terraform Plan
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Plan
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "=========================================="
              echo "Terraform Action:"
              echo "${{ parameters.terraformAction }}"
              echo "=========================================="

              if [ "${{ parameters.terraformAction }}" = "destroy" ]; then

                echo "Creating DESTROY plan..."

                terraform plan \
                  -destroy \
                  -input=false \
                  -out=tfplan

              else

                echo "Creating APPLY plan..."

                terraform plan \
                  -input=false \
                  -out=tfplan

              fi

        # ----------------------------------------------------
        # Publish Terraform Plan
        # ----------------------------------------------------

        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan'
            artifact: terraform-plan

# ============================================================
# STAGE 3 - TERRAFORM APPLY / DESTROY
# ============================================================

- stage: TerraformDeploy
  displayName: Terraform ${{ parameters.terraformAction }}

  dependsOn:
    - TerraformPlan

  condition: succeeded()

  jobs:
    - job: DeployTerraform
      displayName: Terraform ${{ parameters.terraformAction }}

      steps:

        - checkout: self
          displayName: Checkout repository

        # ----------------------------------------------------
        # Download Terraform Plan
        # ----------------------------------------------------

        - task: DownloadPipelineArtifact@2
          displayName: Download Terraform Plan
          inputs:
            artifact: terraform-plan
            path: '$(Pipeline.Workspace)/terraform-plan'

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing remote Terraform backend..."

              terraform init -input=false

        # ----------------------------------------------------
        # Create Variables
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Prepare Terraform Variables
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              cat > pipeline.auto.tfvars <<EOF
              subscription_id = "$SUBSCRIPTION_ID"
              EOF

        # ----------------------------------------------------
        # Terraform Apply / Destroy
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform ${{ parameters.terraformAction }}
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "=========================================="
              echo "Terraform Action:"
              echo "${{ parameters.terraformAction }}"
              echo "=========================================="

              terraform apply \
                -input=false \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"

        # ----------------------------------------------------
        # Terraform Outputs
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Output
          condition: succeeded()
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "=========================================="
              echo "Terraform Outputs"
              echo "=========================================="

              terraform output

# ============================================================
# STAGE 4 - BUILD AND PUSH DOCKER IMAGE
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image

  dependsOn:
    - TerraformDeploy

  condition: and(
    succeeded(),
    eq('${{ parameters.terraformAction }}', 'apply'))

  jobs:
    - job: Docker
      displayName: Build Docker Image

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init -input=false

        # ----------------------------------------------------
        # Create Variables
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Prepare Terraform Variables
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              cat > pipeline.auto.tfvars <<EOF
              subscription_id = "$SUBSCRIPTION_ID"
              EOF

        # ----------------------------------------------------
        # Build and Push
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Build and Push Docker Image
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              ACR_NAME=$(terraform output -raw acr_name)

              echo "ACR: $ACR_NAME"

              cd ..

              IMAGE_TAG="$(Build.BuildId)"
              IMAGE="$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG"

              echo "Building image:"
              echo "$IMAGE"

              az acr login --name "$ACR_NAME"

              docker build \
                -t "$IMAGE" \
                .

              docker push "$IMAGE"

              echo "Docker image pushed successfully."

# ============================================================
# STAGE 5 - DEPLOY CONTAINER APP
# ============================================================

- stage: ContainerAppDeploy
  displayName: Deploy Container App

  dependsOn:
    - BuildAndPush

  condition: succeeded()

  jobs:
    - job: DeployContainerApp
      displayName: Deploy FastAPI Container App

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init -input=false

        # ----------------------------------------------------
        # Deploy Container App
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Deploy Container App
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              ACR_NAME=$(terraform output -raw acr_name)
              RESOURCE_GROUP=$(terraform output -raw resource_group_name)
              CONTAINER_APP=$(terraform output -raw container_app_name)

              IMAGE="$ACR_NAME.azurecr.io/sre-api:$(Build.BuildId)"

              echo "=========================================="
              echo "Container App Deployment"
              echo "=========================================="
              echo "Resource Group: $RESOURCE_GROUP"
              echo "Container App:  $CONTAINER_APP"
              echo "Image:          $IMAGE"
              echo "=========================================="

              az containerapp update \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE"

              echo "Container App deployment completed."

        # ----------------------------------------------------
        # Get Application URL
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Get Application URL
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              RESOURCE_GROUP=$(terraform output -raw resource_group_name)
              CONTAINER_APP=$(terraform output -raw container_app_name)

              FQDN=$(az containerapp show \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn \
                --output tsv)

              echo ""
              echo "=========================================="
              echo " FastAPI Application"
              echo "=========================================="
              echo "https://$FQDN"
              echo ""
              echo "Swagger:"
              echo "https://$FQDN/docs"
              echo "=========================================="