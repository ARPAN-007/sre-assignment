trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: terraformAction
    displayName: Terraform Action
    type: string
    default: apply
    values:
      - apply
      - destroy

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  terraformWorkingDirectory: 'terraform'
  azureServiceConnection: 'azure-sre-assessment'

stages:

# ============================================================
# 1. TERRAFORM VALIDATE
# ============================================================

- stage: Validate
  displayName: Terraform Validate

  jobs:
    - job: ValidateTerraform
      displayName: Validate Terraform

      steps:

        - checkout: self

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Initializing Terraform backend..."

              terraform init -input=false

        - bash: |
            set -e

            cd "$(terraformWorkingDirectory)"

            terraform fmt -check -recursive
          displayName: Terraform Format Check

        - task: AzureCLI@2
          displayName: Terraform Validate
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform validate


# ============================================================
# 2. TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: Terraform Plan

  dependsOn: Validate

  condition: succeeded()

  jobs:
    - job: Plan
      displayName: Terraform Plan

      steps:

        - checkout: self

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init -input=false

        - task: AzureCLI@2
          displayName: Terraform Plan
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "Terraform action: ${{ parameters.terraformAction }}"

              if [ "${{ parameters.terraformAction }}" = "destroy" ]; then

                echo "Creating DESTROY plan..."

                terraform plan \
                  -destroy \
                  -input=false \
                  -out=tfplan

              else

                echo "Creating APPLY plan..."

                terraform plan \
                  -input=false \
                  -out=tfplan

              fi

        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan'
            artifact: terraform-plan


# ============================================================
# 3. TERRAFORM APPLY / DESTROY
# ============================================================

- stage: TerraformDeploy
  displayName: Terraform ${{ parameters.terraformAction }}

  dependsOn: TerraformPlan

  condition: succeeded()

  jobs:
    - job: TerraformApply
      displayName: Terraform ${{ parameters.terraformAction }}

      steps:

        - checkout: self

        - task: DownloadPipelineArtifact@2
          displayName: Download Terraform Plan
          inputs:
            artifact: terraform-plan
            path: '$(Pipeline.Workspace)/terraform-plan'

        - bash: |
            set -e

            TERRAFORM_VERSION="$(terraformVersion)"

            echo "Installing Terraform ${TERRAFORM_VERSION}"

            curl -fsSL \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
              -o terraform.zip

            rm -rf terraform-bin
            mkdir terraform-bin

            unzip -o terraform.zip -d terraform-bin

            sudo mv terraform-bin/terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        - task: AzureCLI@2
          displayName: Terraform Init
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform init -input=false

        - task: AzureCLI@2
          displayName: Terraform ${{ parameters.terraformAction }}
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              echo "=========================================="
              echo "Terraform Action:"
              echo "${{ parameters.terraformAction }}"
              echo "=========================================="

              terraform apply \
                -input=false \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"

        - task: AzureCLI@2
          displayName: Terraform Output
          condition: succeeded()
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              terraform output


# ============================================================
# 4. BUILD DOCKER IMAGE + PUSH TO ACR
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image

  dependsOn: TerraformDeploy

  condition: and(
    succeeded(),
    eq('${{ parameters.terraformAction }}', 'apply'))

  jobs:
    - job: Docker
      displayName: Build Docker Image

      steps:

        - checkout: self

        - task: AzureCLI@2
          displayName: Get ACR Information
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              ACR_NAME=$(terraform output -raw acr_name)

              echo "ACR_NAME=$ACR_NAME"

              echo "##vso[task.setvariable variable=ACR_NAME]$ACR_NAME"

        - task: AzureCLI@2
          displayName: Login to ACR
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              ACR_NAME="$(ACR_NAME)"

              echo "Logging into ACR: $ACR_NAME"

              az acr login --name "$ACR_NAME"

        - bash: |
            set -e

            IMAGE_TAG="$(Build.BuildId)"

            IMAGE="$(ACR_NAME).azurecr.io/sre-api:${IMAGE_TAG}"

            echo "Building image:"
            echo "$IMAGE"

            docker build \
              -t "$IMAGE" \
              .
          displayName: Docker Build

        - task: AzureCLI@2
          displayName: Docker Push
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              IMAGE="$(ACR_NAME).azurecr.io/sre-api:$(Build.BuildId)"

              echo "Pushing image:"
              echo "$IMAGE"

              az acr login --name "$(ACR_NAME)"

              docker push "$IMAGE"


# ============================================================
# 5. DEPLOY CONTAINER APP
# ============================================================

- stage: ContainerAppDeploy
  displayName: Deploy FastAPI Container App

  dependsOn: BuildAndPush

  condition: succeeded()

  jobs:
    - job: DeployContainerApp
      displayName: Deploy Container App

      steps:

        - checkout: self

        - task: AzureCLI@2
          displayName: Deploy Container App
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              ACR_NAME=$(terraform output -raw acr_name)

              RESOURCE_GROUP=$(terraform output -raw resource_group_name)

              CONTAINER_APP=$(terraform output -raw container_app_name)

              IMAGE="${ACR_NAME}.azurecr.io/sre-api:$(Build.BuildId)"

              echo "=========================================="
              echo "Resource Group:"
              echo "$RESOURCE_GROUP"
              echo ""
              echo "Container App:"
              echo "$CONTAINER_APP"
              echo ""
              echo "Image:"
              echo "$IMAGE"
              echo "=========================================="

              az containerapp update \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE"

              echo "Container App deployment completed."

        - task: AzureCLI@2
          displayName: Get Application URL
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              cd "$(terraformWorkingDirectory)"

              RESOURCE_GROUP=$(terraform output -raw resource_group_name)

              CONTAINER_APP=$(terraform output -raw container_app_name)

              FQDN=$(az containerapp show \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn \
                --output tsv)

              echo ""
              echo "======================================"
              echo " FastAPI Application"
              echo "======================================"
              echo "https://$FQDN"
              echo ""
              echo "Swagger:"
              echo "https://$FQDN/docs"
              echo "======================================"