trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  terraformWorkingDirectory: 'terraform'

stages:

# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================
- stage: Plan
  displayName: 'Terraform Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Init and Plan'

    steps:

    # --------------------------------------------------------
    # Azure authentication
    # --------------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: 'YOUR-AZURE-SERVICE-CONNECTION'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          echo "======================================"
          echo "Checking Azure authentication"
          echo "======================================"

          az account show

          echo "======================================"
          echo "Installing Terraform ${TF_VERSION}"
          echo "======================================"

          TF_VERSION="${TF_VERSION}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
            -o terraform.zip

          unzip -o terraform.zip

          sudo rm -f /usr/local/bin/terraform
          sudo mv terraform /usr/local/bin/terraform

          terraform version

          echo "======================================"
          echo "Terraform Init"
          echo "======================================"

          cd "$(Build.SourcesDirectory)/${TF_WORKING_DIR}"

          terraform init -reconfigure

          echo "======================================"
          echo "Terraform Plan"
          echo "======================================"

          terraform plan \
            -var-file="dev.tfvars" \
            -out=tfplan

          echo "Terraform plan completed successfully."

      env:
        TF_VERSION: $(terraformVersion)
        TF_WORKING_DIR: $(terraformWorkingDirectory)


# ============================================================
# STAGE 2 - TERRAFORM APPLY
# ============================================================
- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn: Plan

  condition: succeeded()

  jobs:
  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment: 'sre-assignment-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: 'YOUR-AZURE-SERVICE-CONNECTION'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "======================================"
                echo "Installing Terraform"
                echo "======================================"

                TF_VERSION="${TF_VERSION}"

                curl -fsSL \
                  "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
                  -o terraform.zip

                unzip -o terraform.zip

                sudo rm -f /usr/local/bin/terraform
                sudo mv terraform /usr/local/bin/terraform

                terraform version

                cd "$(Build.SourcesDirectory)/${TF_WORKING_DIR}"

                echo "======================================"
                echo "Terraform Init"
                echo "======================================"

                terraform init -reconfigure

                echo "======================================"
                echo "Terraform Apply"
                echo "======================================"

                terraform apply \
                  -auto-approve \
                  -var-file="dev.tfvars"

                echo "======================================"
                echo "Terraform Apply Completed"
                echo "======================================"

            env:
              TF_VERSION: $(terraformVersion)
              TF_WORKING_DIR: $(terraformWorkingDirectory)


# ============================================================
# STAGE 3 - CLEANUP ON FAILED APPLY
# ============================================================
- stage: Cleanup
  displayName: 'Cleanup Partial Terraform Deployment'

  dependsOn: Apply

  condition: failed()

  jobs:
  - job: TerraformCleanup
    displayName: 'Destroy Partial Deployment'

    steps:

    - task: AzureCLI@2
      displayName: 'Terraform Destroy Partial Deployment'
      inputs:
        azureSubscription: 'YOUR-AZURE-SERVICE-CONNECTION'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          set -e

          echo "======================================"
          echo "Installing Terraform"
          echo "======================================"

          TF_VERSION="${TF_VERSION}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
            -o terraform.zip

          unzip -o terraform.zip

          sudo rm -f /usr/local/bin/terraform
          sudo mv terraform /usr/local/bin/terraform

          terraform version

          cd "$(Build.SourcesDirectory)/${TF_WORKING_DIR}"

          echo "======================================"
          echo "Terraform Init"
          echo "======================================"

          terraform init -reconfigure

          echo "======================================"
          echo "Terraform State"
          echo "======================================"

          terraform state list || true

          echo "======================================"
          echo "Destroying Resources From State"
          echo "======================================"

          terraform destroy \
            -auto-approve \
            -var-file="dev.tfvars"

          echo "======================================"
          echo "Cleanup Completed"
          echo "======================================"

      env:
        TF_VERSION: $(terraformVersion)
        TF_WORKING_DIR: $(terraformWorkingDirectory)


# ============================================================
# 2. DOCKER BUILD + ACR PUSH
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image
  dependsOn: Terraform
  condition: and(
    succeeded(),
    eq('${{ parameters.terraformAction }}', 'apply'))

  jobs:

  - job: Docker
    displayName: Build Docker Image

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Azure Login
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Login to Azure
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          echo "ACR: $ACR_NAME"

          az acr login --name "$ACR_NAME"

    # --------------------------------------------------------
    # Get ACR Name
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Get ACR Information
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          echo "##vso[task.setvariable variable=ACR_NAME]$ACR_NAME"

          echo "ACR_NAME=$ACR_NAME"

    # --------------------------------------------------------
    # Build Docker Image
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Docker Build
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          IMAGE_TAG=$(Build.BuildId)

          docker build \
            -t "$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG" \
            .

    # --------------------------------------------------------
    # Push Docker Image
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Docker Push
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          IMAGE_TAG=$(Build.BuildId)

          az acr login --name "$ACR_NAME"

          docker push \
            "$ACR_NAME.azurecr.io/sre-api:$IMAGE_TAG"


# ============================================================
# 3. DEPLOY CONTAINER APP
# ============================================================

- stage: Deploy
  displayName: Deploy FastAPI
  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

  - job: DeployContainerApp
    displayName: Deploy Container App

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: Deploy Container App
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          ACR_NAME=$(cd terraform && terraform output -raw acr_name)

          RESOURCE_GROUP=$(cd terraform && terraform output -raw resource_group_name)

          CONTAINER_APP=$(cd terraform && terraform output -raw container_app_name)

          IMAGE="$ACR_NAME.azurecr.io/sre-api:$(Build.BuildId)"

          echo "Resource Group: $RESOURCE_GROUP"
          echo "Container App: $CONTAINER_APP"
          echo "Image: $IMAGE"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

          echo "Deployment completed."

    # --------------------------------------------------------
    # Get Application URL
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Get Application URL
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          RESOURCE_GROUP=$(cd terraform && terraform output -raw resource_group_name)

          CONTAINER_APP=$(cd terraform && terraform output -raw container_app_name)

          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo ""
          echo "======================================"
          echo " FastAPI Application"
          echo "======================================"
          echo "https://$FQDN"
          echo ""
          echo "Swagger:"
          echo "https://$FQDN/docs"
          echo "======================================"